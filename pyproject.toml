[project]
name = "loopspec"
version = "0.1.0"
description = "Gated artifact workflow CLI: LLM-driven artifact generation with quality gates and auditable rollback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
]

[project.scripts]
loopspec = "loopspec.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loopspec"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "loopspec/builtin_schemas"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["loopspec"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
