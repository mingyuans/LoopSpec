[project]
name = "loopspec"
# Resolved by hatch_version.py from the git tag being built, so the version is
# declared in exactly one place: the tag. See [tool.hatch.version] below.
dynamic = ["version"]
description = "Gated artifact workflow CLI: LLM-driven artifact generation with quality gates and auditable rollback"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "typer>=0.12",
    "rich>=13",
    "questionary>=2.1",
]

[project.scripts]
loopspec = "loopspec.cli:app"

[build-system]
# Bounded on purpose: the release workflow resolves and executes the build
# backend on every run, so an unconstrained requirement would widen that to
# whatever the index serves. Not hash-pinning -- pyproject cannot express it.
requires = ["hatchling>=1.31,<2"]
build-backend = "hatchling.build"

# A local module rather than a VCS plugin: the tag still decides the version, but
# the build keeps executing only hatchling, and a wheel built from a released
# sdist -- no tag, no git -- still resolves through PKG-INFO.
[tool.hatch.version]
source = "code"
path = "hatch_version.py"
expression = "resolve_version()"

[tool.hatch.build.targets.wheel]
packages = ["src/loopspec"]

[tool.hatch.build.targets.wheel.force-include]
# Both bundled resource trees (schemas + skills) travel as one directory, which
# is what `builtin_resources.builtin_root()` resolves to inside an install.
"builtin" = "loopspec/builtin"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "pytest-bdd>=9,<10",
    "pytest-xdist>=3,<4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
packages = ["loopspec"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "subprocess: runs the installed loopspec executable in a child process",
    "timing: asserts a wall-clock budget; run serially, outside the parallel pass",
    "catalog: BDD scenarios of tests/features/catalog.feature",
    "change: BDD scenarios of tests/features/change.feature",
    "init: BDD scenarios of tests/features/init.feature",
    "memory: BDD scenarios of tests/features/memory.feature",
    "node_gate: BDD scenarios of tests/features/node_gate.feature",
    "plan: BDD scenarios of tests/features/plan.feature",
    "plan_guard: BDD scenarios of tests/features/plan_guard.feature",
    "plan_revision: BDD scenarios of tests/features/plan_revision.feature",
    "registry: BDD scenarios of tests/features/registry.feature",
    "state_add: BDD scenarios of tests/features/state_add.feature",
    "update: BDD scenarios of tests/features/update.feature",
    "version: BDD scenarios of tests/features/version.feature",
]
