name: Release

# Two paths through one workflow:
#   - a push to the default branch runs `verify` only
#   - pushing a v<version> tag runs `verify`, then publishes
#
# The tag pattern narrows what reaches this workflow, but it is NOT validation:
# GitHub's ref globs cannot express "three numeric segments", and the trailing
# wildcard admits any suffix. The real gate is the check in the release job,
# which accepts exactly two shapes: vX.Y.Z (stable) and vX.Y.Z-beta (beta).
on:
  push:
    branches: [main]
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:

# Read-only by default; only the release job is raised to write.
permissions:
  contents: read

# Values that come from outside (ref names, API responses) are passed into
# scripts through step-level `env:` and referenced as quoted shell variables.
# `${{ }}` never appears inside a `run:` body: expressions expand before the
# shell sees the script, so an interpolated `v1.0.0$(...)` tag would execute
# before any validation could reject it.

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Otherwise the token is written into .git/config as an http
          # extraheader, where every later step in this job could read it.
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # --frozen is CI-specific; everything else goes through the Makefile so the
      # checks here cannot drift from the ones contributors run.
      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Test
        run: make test

      # Explicit rather than via `make release-dry-run`, which tolerates a
      # missing shellcheck locally. Here both checks are mandatory.
      - name: Check install.sh
        run: |
          sh -n install.sh
          shellcheck install.sh

      - name: Build
        run: make build

  release:
    needs: verify
    # Skipped for branch pushes and for a manual run on a branch: without a tag
    # there is no release version, and guessing one is exactly what this design
    # rejects.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # GITHUB_REF_NAME is read as an environment variable, not interpolated.
      # Validation happens before the value is written to GITHUB_ENV, so a
      # malformed tag can never reach a later step, a path, or an argument.
      #
      # Only two tag shapes exist, each with one package version:
      #   vX.Y.Z      -> X.Y.Z    stable, published as the latest release
      #   vX.Y.Z-beta -> X.Y.Zb0  beta, published as a prerelease, never latest
      # VERSION is the normalized package version (PEP 440 spells a bare beta
      # "b0"), which is what hatchling names the artifacts after. It must match
      # loopspec.self_update.package_version, hatch_version.py and the Makefile.
      #
      # LOOPSPEC_BUILD_VERSION is what makes the tag authoritative: the build
      # backend reads it (hatch_version.py) and names the artifacts after it, so
      # there is no declared version for the tag to disagree with.
      - name: Resolve and validate version from tag
        run: |
          tag="$GITHUB_REF_NAME"
          case "$tag" in
            v*-beta) base="${tag#v}"; base="${base%-beta}"; prerelease=true ;;
            v*) base="${tag#v}"; prerelease=false ;;
            *) base=""; prerelease=false ;;
          esac
          # The case rules out anything but digits and dots (a newline included,
          # which grep would otherwise judge line by line); the regex then
          # requires exactly three numeric segments.
          case "$base" in
            "" | *[!0-9.]*) valid=false ;;
            *) valid=true ;;
          esac
          if [ "$valid" != true ] || ! printf '%s' "$base" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag '$tag' does not name a valid version: expected vX.Y.Z or vX.Y.Z-beta" >&2
            exit 1
          fi
          if [ "$prerelease" = true ]; then version="${base}b0"; else version="$base"; fi
          printf 'TAG=%s\n' "$tag" >>"$GITHUB_ENV"
          printf 'VERSION=%s\n' "$version" >>"$GITHUB_ENV"
          printf 'LOOPSPEC_BUILD_VERSION=%s\n' "$version" >>"$GITHUB_ENV"
          printf 'PRERELEASE=%s\n' "$prerelease" >>"$GITHUB_ENV"

      # git tags belong to no branch, so "tag a commit on the default branch"
      # can only be checked as reachability. Done over the API rather than with
      # git, so checkout needs neither full history nor persisted credentials.
      - name: Require the tagged commit to be on the default branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          default_branch=$(gh api "repos/$GITHUB_REPOSITORY" --jq .default_branch)
          [ -n "$default_branch" ] || { echo "::error::could not resolve the default branch" >&2; exit 1; }
          status=$(gh api "repos/$GITHUB_REPOSITORY/compare/$default_branch...$GITHUB_SHA" --jq .status)
          case "$status" in
            # identical: the tag is on the branch head.
            # behind: the tag is an ancestor of it (releasing an older commit).
            identical | behind) ;;
            *)
              echo "::error::tag '$TAG' is not reachable from '$default_branch' (compare status: $status)" >&2
              exit 1
              ;;
          esac

      # A tag push is an explicit request to publish, so "already released" is a
      # failure, not something to skip quietly. Only a definite "not found"
      # continues -- any other error stops the job.
      - name: Require the release not to exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if response=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>&1); then
            echo "::error::release $TAG already exists. Either remove it (gh release delete $TAG --cleanup-tag) and push the tag again, or release a new version." >&2
            exit 1
          fi
          # Only a definite 404 means "safe to publish". Any other failure is a
          # query we could not answer, and must not be read as "does not exist".
          case "$response" in
            *"Not Found"*) ;;
            *)
              echo "::error::could not determine whether release $TAG exists: $response" >&2
              exit 1
              ;;
          esac

      # No token in this step: `uv build` executes the build backend declared in
      # pyproject.toml, which is third-party code resolved at build time.
      # LOOPSPEC_BUILD_VERSION comes from the job environment, so the artifacts
      # are named after the validated tag; the asset checks below catch it if not.
      - name: Build
        run: make build

      - name: Generate checksums
        run: |
          cd dist
          sha256sum "loopspec-$VERSION-py3-none-any.whl" "loopspec-$VERSION.tar.gz" \
            >../checksums.txt
          cat ../checksums.txt

      # Assets are named explicitly rather than globbed: the contract is "these
      # three files and nothing else", which `dist/*` cannot express -- it would
      # publish whatever happens to be in the directory. The existence checks
      # also catch a build whose output does not match the tag's version.
      #
      # A beta is a prerelease and must never become "latest": install.sh and
      # `loopspec update` both resolve releases/latest/download/, so a beta marked
      # latest would be pushed to every user. A stable release claims latest
      # explicitly rather than relying on GitHub's default. `flags` is one of two
      # fixed literals, never external input, so leaving it unquoted is safe.
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          wheel="dist/loopspec-$VERSION-py3-none-any.whl"
          sdist="dist/loopspec-$VERSION.tar.gz"
          for asset in "$wheel" "$sdist" checksums.txt; do
            [ -f "$asset" ] || { echo "::error::missing release asset: $asset" >&2; exit 1; }
          done
          # Anything but the two values the version step writes is an error, not a
          # default: falling back to --latest would publish a beta as latest.
          case "$PRERELEASE" in
            true) flags="--prerelease --latest=false" ;;
            false) flags="--latest" ;;
            *) echo "::error::PRERELEASE must be true or false, got '$PRERELEASE'" >&2; exit 1 ;;
          esac
          # shellcheck disable=SC2086
          gh release create "$TAG" "$wheel" "$sdist" checksums.txt \
            --title "$TAG" \
            --generate-notes \
            $flags
