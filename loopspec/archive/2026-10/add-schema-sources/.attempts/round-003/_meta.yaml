blocking_issues:
- 给 registry 同步加入**schema 级版本号**：复用 `schema.yaml` 已有的必填字段 `version`（正整数）。`loopspec
  schemas update` 的计划中每个 schema 报告 `localVersion`、`upstreamVersion`、`baseVersion`（上次同步时的版本，来自锁文件）；锁文件
  `registry.lock.yaml` 按 schema 记录同步时的 `version`；`loopspec schemas list` 报告每个本地 schema
  的版本，以及它最近一次从 registry 同步时的版本 / registry 版本。上游文件有变化但 `version` 没有增加时，`schemas update`
  给出 warning（提醒 registry 维护者升版本）。
- 给 registry 同步加入**registry 级版本号**：用 git tag 标识整个 registry 的发布版本。`schemas update`
  读取上游 commit 与锁定基线 commit 对应的 tag（如 `git describe --tags`），在计划中报告 `upstreamTag` 与
  `baseTag`；锁文件记录同步时的 tag。registry 没有 tag 时退回显示 commit，不要求 registry 必须打 tag。`registry.ref`
  可以写成 tag（现有 ref 校验已允许）。
- 上述版本信息同时体现在 `loopspec-update-schemas` skill 给用户的变更汇总中（例如「team-flow：本地 v3 → 上游 v5；registry
  v1.2.0 → v1.3.0」），以及中英文文档中。
- 'registry 模型：`config.yaml` 的 `registry: {url, ref?, path?}`；`/lpsx:update-schemas`
  驱动 `schemas update`（本机 git 拉取 + 三方比对，不改本地）→ 汇总变更并一次确认 → 逐个冲突合并确认 → `schemas apply
  --plan <id>`。'
- 锁文件 `loopspec/registry.lock.yaml`（提交）记录上次同步的 commit 与文件哈希作为基线；全量同步；私有 schema 不受影响；上游删除需确认。
- 通过 git 对象读取、私有裸仓库、不 checkout；拒绝符号链接与子模块；apply 前做 planId / 冲突 / 本地哈希 / `load_schema`
  四项校验。
- 非目标：多 registry、部分同步、HTTP 归档、自动合并、推送、配置内凭据。
- security 第 3 轮 PASS；任务 8 组 33 项。
- 版本信息只用于**展示与提示**，不参与分类与合并决策（分类仍只看哈希），避免「version 相同但内容不同」时做出错误判断。
- tag 读取同样只能经 `_run_git`（`describe --tags --exact-match` 或 `--abbrev=0`），tag 名作为远程输入需要做字符校验后再输出；fetch
  需要拉取 tag（当前 D3 为 `--no-tags`，需调整为只拉取所需 tag 或 `--tags`）。
- '`upstreamVersion` 从上游 `schema.yaml` 的 blob 中解析（`yaml.safe_load`，解析失败时报告为 `null`
  并 warning），不要为此加载完整 schema。'
- 'Decision Log: round 2 - changes requested'
- 'Rejected Options: 不加版本号直接批准；只做 schema 级或只做 registry 级'
- 'Open Questions: 无（版本信息只用于展示与提示）'
