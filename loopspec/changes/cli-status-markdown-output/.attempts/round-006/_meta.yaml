- 'Open Questions: glob 节点多行呈现的三处未定细节——续行缩进的列位计算、多行节点与 `blocked`/`tracks`/gate 备注共存时备注放在哪一行、glob
  匹配 0 个文件时该节点行如何呈现。'
- 'Current Focus: redo design/specs/tasks per round 4 approval feedback（glob 节点改为列出全部匹配文件，续行缩进不得顶格），再过一次
